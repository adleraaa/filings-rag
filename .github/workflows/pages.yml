name: Pages

on:
  push:
    branches: [main]
    paths: ["explorer/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # explorer/ holds a static page plus explorer.json exported from results/
      # (filings-rag export-explorer), so nothing needs to be built here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer
      - id: deployment
        uses: actions/deploy-pages@v4
