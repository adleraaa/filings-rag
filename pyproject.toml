[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filings-rag"
version = "0.1.0"
description = "Retrieval-augmented QA over SEC filings, evaluated on FinanceBench"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yunlong Lu" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pymupdf>=1.24",
    "openai>=1.40",
    # FastMCP lives at mcp.server.fastmcp in the 1.x SDK; 2.x renamed it.
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
# Embedding + reranking models. Kept optional so CI (which uses fake
# embedders) does not download PyTorch.
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
filings-rag = "filings_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # "a b c".split() is the readable way to write a stopword list

[tool.pytest.ini_options]
testpaths = ["tests"]
